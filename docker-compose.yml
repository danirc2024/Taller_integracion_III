services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: bd_supermercados
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./infrastructure/db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
    - microservices_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
  go_service:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
      target: builder
    command:
    - air
    container_name: go_service_api
    ports:
    - 8080:8080
    environment:
    - PORT=8080
    - DB_HOST=db
    - DB_PORT=5432
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_NAME=${DB_NAME}
    - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    - REDIS_URL=redis://redis:6379/0
    depends_on:
    - db
    volumes:
    - ./backend/api:/app
    - /app/tmp
    restart: unless-stopped
    networks:
    - microservices_net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 200M
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      target: development
    container_name: frontend_web
    ports:
    - 3000:3000
    environment:
    - VITE_API_URL=http://localhost:8080
    volumes:
    - ./frontend/web:/app
    - /app/node_modules
    restart: unless-stopped
    networks:
    - microservices_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
    - 6379:6379
    restart: unless-stopped
    networks:
    - microservices_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 100M
  bot_discord:
    build:
      context: ./backend/bot_discord
      dockerfile: Dockerfile
    container_name: discord_scrum_bot
    environment:
    - PORT=8081
    - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-missing}
    - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-missing}
    - DISCORD_PUSH_CHANNEL_ID=${DISCORD_PUSH_CHANNEL_ID:-}
    ports:
    - 8081:8081
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 200M
    restart: unless-stopped
    networks:
    - microservices_net
  scraper_worker:
    build:
      context: ./backend/scraper
      dockerfile: Dockerfile
    container_name: python_scraper_worker
    command:
    - python
    - -m
    - scraper_core.worker
    environment:
    - REDIS_URL=redis://redis:6379/0
    - SCRAPER_API_URL=http://go_service:8080/api/v1/scraper/productos
    depends_on:
    - redis
    - go_service
    volumes:
    - ./backend/scraper:/app
    restart: unless-stopped
    networks:
    - microservices_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 400M
networks:
  microservices_net:
    driver: bridge
volumes:
  pgdata: null

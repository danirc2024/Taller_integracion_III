services:
  # Base de Datos Unificada
  db:
    image: postgres:15-alpine
    container_name: bd_supermercados
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Eliminamos POSTGRES_DB maestro, el script init.sql creará las múltiples DBs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    restart: unless-stopped
    networks:
      - microservices_net

  # Message Broker (para encolar tareas de scraping)
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - microservices_net

  # API Gateway / Backend Central (Ej. FastAPI)
  api_gateway:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/api_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - microservices_net

  # Microservicio de Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: frontend_web
    ports:
      - "3000:3000" 
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    depends_on:
      - api_gateway
    restart: unless-stopped
    networks:
      - microservices_net

  # Microservicio de Scraping Asíncrono
  scraper_supermercados:
    build:
      context: ./backend/scraper
      dockerfile: Dockerfile
    container_name: web_scraper_alimentos
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/scraper_db
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0' # Evita acaparar el Pentium durante recolección masiva
          memory: 3G  # Contención contra fugas de memoria
    restart: unless-stopped
    networks:
      - microservices_net

  # Microservicio de Optimización Espacial y Algoritmia
  motor_rutas_gasolina:
    build:
      context: ./backend/motor_rutas
      dockerfile: Dockerfile
    container_name: spatial_optimizer
    environment:
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/rutas_db
      - MAPS_API_KEY=${MAPS_API_KEY}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.8' # Prioridad balanceada
          memory: 2G
    restart: unless-stopped
    networks:
      - microservices_net

  # Microservicio de IA Conversacional (Asistente y Chatbot)
  ia_conversacional:
    build:
      context: ./backend/ia_conversacional
      dockerfile: Dockerfile
    container_name: ia_chatbot_service
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Variable preparada por si el desarrollador decide mutar de JSON a DB
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/api_db
    deploy:
      resources:
        limits:
          cpus: '0.5' # La IA pesada corre en Cloud, FastAPI local consume poco
          memory: 1G
    restart: unless-stopped
    networks:
      - microservices_net

  # Microservicio en Go (Base en espera del código real de Matu)
  go_service:
    image: golang:1.21-alpine
    container_name: go_backend_service
    working_dir: /app
    volumes:
      - ./backend/go_service:/app
    # Espera a que el código exista para levantarlo, de lo contrario se queda activo esperando
    command: sh -c "if [ -f main.go ]; then go run main.go; else echo 'Waiting for Go code...' && tail -f /dev/null; fi"
    ports:
      - "8081:8080" # Expuesto externamente en el puerto 8081
    environment:
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/api_db
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - microservices_net

  # OpenTripPlanner (Soporte Transporte Público y Multimodal - Reemplaza a OSRM)
  otp_engine:
    image: docker.io/opentripplanner/opentripplanner:latest
    container_name: otp_engine
    # Nota: Requiere carpeta con OSM (PBF) y GTFS (.zip) para construir el grafo
    command: "--build --serve /var/otp/graphs"
    volumes:
      - ./backend/motor_rutas/otp_data:/var/otp/graphs
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '2.0' 
          memory: 4G # OTP requiere más memoria para cargar grafos completos
    restart: unless-stopped
    networks:
      - microservices_net

networks:
  microservices_net:
    driver: bridge

volumes:
  pgdata:

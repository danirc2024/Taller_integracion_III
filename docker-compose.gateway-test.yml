# Isolated integration stack: distinct container names, volumes and local ports.
services:
  db:
    container_name: !reset null
    ports: !reset []
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ${SUP265_INIT_DIR:?Define SUP265_INIT_DIR}:/docker-entrypoint-initdb.d:ro
  redis:
    container_name: !reset null
    ports: !reset []
  go_service:
    image: sup265-api:local
    build:
      network: ${SUP265_BUILD_NETWORK:-default}
      secrets:
        - network_ca
    container_name: !reset null
    ports: !override ["127.0.0.1:${SUP265_BACKEND_PORT:-18080}:8080"]
  gateway:
    image: sup265-gateway:local
    ports: !override ["127.0.0.1:${SUP265_GATEWAY_PORT:-18082}:8080"]
  frontend:
    image: sup265-frontend:local
    build:
      network: ${SUP265_BUILD_NETWORK:-default}
      secrets:
        - network_ca
    container_name: !reset null
    ports: !override ["127.0.0.1:${SUP265_FRONTEND_PORT:-13000}:3000"]
    volumes: !reset []
    networks:
      microservices_net:
        ipv4_address: ${SUP265_FRONTEND_IP:?Define SUP265_FRONTEND_IP}
networks:
  microservices_net:
    external: true
    name: ${SUP265_NETWORK:?Define SUP265_NETWORK}
secrets:
  network_ca:
    file: ${SUP265_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
